
<div class="phone-calculator">
    <div class="top">
        <button id="history-button" class="history-button" title="History">↺</button>
        <span class="app-name">Calculator</span>
        <button id="history-clear" class="history-clear" title="Clear history">⋯</button>
    </div>

    <div class="display">
        <div id="expression"></div>
        <div id="result">0</div>
    </div>

    <div class="buttons">
        <button class="gray" id="clear-button">AC</button>
        <button class="gray" id="sign-button">+/−</button>
        <button class="gray" id="percent-button">%</button>
        <button class="orange" id="divide-button">÷</button>

        <button class="dark" id="seven">7</button>
        <button class="dark" id="eight">8</button>
        <button class="dark" id="nine">9</button>
        <button class="orange" id="multiply-button">×</button>

        <button class="dark" id="four">4</button>
        <button class="dark" id="five">5</button>
        <button class="dark" id="six">6</button>
        <button class="orange" id="subtract-button">−</button>

        <button class="dark" id="one">1</button>
        <button class="dark" id="two">2</button>
        <button class="dark" id="three">3</button>
        <button class="orange" id="add-button">+</button>

        <button class="dark" id="decimal-button">.</button>
        <button class="dark" id="zero">0</button>
        <button class="dark" id="backspace-button">⌫</button>
        <button class="orange" id="equals-button">=</button>
    </div>

    <div id="history-panel" class="history-panel">
        <div class="history-heading">
            <span>History</span>
            <button id="history-close">Done</button>
        </div>
        <div id="history-list"></div>
        <p id="history-empty">Your calculations will appear here.</p>

<div class="basic-calculator-tests">
    <input id="first-number" type="number" value="0" />
    <input id="second-number" type="number" value="0" />

    <select id="operation-select">
        <option value="add">Add</option>
        <option value="subtract">Subtract</option>
        <option value="multiply">Multiply</option>
        <option value="divide">Divide</option>
    </select>

    <button id="calculate-button" type="button">Calculate</button>
</div>

    </div>
</div>
